apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-service
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-service
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: execution-service
          image: execution-service
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: execution-service-config
            - secretRef:
                name: execution-service-secret
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
